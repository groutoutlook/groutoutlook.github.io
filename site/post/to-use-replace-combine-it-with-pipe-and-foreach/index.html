            <ul>
<li>To use <code>-replace</code>,  combine it with pipe (<code>|</code>) and <code>foreach</code> (<code>%</code>)</li>
</ul>
<pre class="syntax-highlighting"><code class="language-PowerShell"><span class="text plain">$string = &quot;ok now I want to hit you.&quot;
$string | % {$_ -replace &quot;now&quot;,&quot;yeah&quot;} | echo
</span></code></pre>

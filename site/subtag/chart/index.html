<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <title>TILs: chart</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <script type="text/javascript" src="/index.js"></script>
        <nav class="top-links" aria-label="Site navigation">
            <a class="top-link" href="/">All TILs</a>
            <label class="theme-toggle">
                <input type="checkbox" role="switch" onchange="setTheme(this.checked ? 'dark' : 'light')">
                <span>Dark mode</span>
            </label>
        </nav>

        <h1>TILs with in-topic tag chart</h1>

        <hr>

        <div class="til">
            <header class="til-header">
                <h3><a class="til-title" href="/post/cayman-islands">Cayman Islands</a></h3>
                <span class="til-date">2025-05-15 04:44:31 PM</span>
                <a class="til-tag parent-tag" href="/category/place"><span>#place</span></a>
                <a class="til-tag" href="/category/geography">
                    <span>geography</span>
                </a>
                <a class="til-tag" href="/category/usa">
                    <span>usa</span>
                </a>
                <a class="til-tag in-topic-tag" href="/subtag/chart">
                    <span>#chart</span>
                </a>
                <a class="til-tag in-topic-tag" href="/subtag/meta">
                    <span>#meta</span>
                </a>
            </header>
        </div>
    </body>
</html>
